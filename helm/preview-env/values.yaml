replicaCount: 1

image:
  repository: preview-app
  tag: test
  pullPolicy: Never

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  host: preview.local

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

env:
  environment: preview
  version: 1.0.0